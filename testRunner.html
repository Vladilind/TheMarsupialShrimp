<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Unit Tests</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; }
        button { display: block; margin: 20px auto; padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #testResults { border: 1px solid #ccc; padding: 10px; margin-top: 20px; background-color: #f9f9f9; }
        .log { border-bottom: 1px solid #eee; padding: 8px 5px; margin-bottom: 5px; font-size: 14px; }
        .log:last-child { border-bottom: none; }
        .pass { background-color: #e6ffe6; color: #006400; }
        .fail { background-color: #ffe6e6; color: #c80000; }
        .summary { margin-top:15px; font-weight:bold; }
        .summary-pass { color: #006400; }
        .summary-fail { color: #c80000; }
    </style>
</head>
<body>
    <h1>Game Unit Tests</h1>
    <button onclick="runAllTests()">Run All Tests</button>
    <div id="testResults"></div>
    <div id="testSummary" class="summary"></div>


    <!-- Canvas element, might be needed by some game scripts during load, though not directly used by tests -->
    <canvas id="gameCanvas" style="display:none;"></canvas>

    <!-- Game Scripts (Order is important) -->
    <script src="js/config.js"></script>
    <script>
        // Mock Audio Manager for tests to prevent audio playback and errors during tests
        const mockAudioManager = {
            initAudio: async () => { console.log('Mock Audio Initialized'); mockAudioManager.audioInitialized = true; },
            loadSound: async (name, url, isMusic) => {
                console.log(`Mock sound loaded: ${name}`);
                mockAudioManager.sounds[name] = { buffer: {}, isMusic: isMusic, name: name};
            },
            playSound: (name, loop) => { console.log(`Mock playing sound: ${name}, loop: ${loop}`); },
            stopSound: (name) => { console.log(`Mock stopping sound: ${name}`); },
            stopAllMusic: () => { console.log('Mock stopping all music'); },
            setMasterVolume: (vol) => { console.log(`Mock master volume: ${vol}`); },
            audioContext: null, // Mock audio context
            audioInitialized: false, // Start as false, initAudio sets to true
            sounds: {}, // Store mock sounds
            masterVolume: 0.5, musicVolume: 0.3, sfxVolume: 0.5, currentMusic: null
        };
        const audioManager = mockAudioManager; // Override actual audioManager if it's global

        // Mock for main.js's auto-start and game loop if necessary
        // This flag tells main.js not to auto-start the game loop.
        window.isRunningTests = true;
    </script>
    <script src="js/player.js"></script>
    <script src="js/enemyService.js"></script>
    <script src="js/zoneService.js"></script>
    <script src="js/collectibleService.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>

    <!-- Test Script -->
    <script src="tests.js"></script>

    <script>
        // Test runner helper functions
        const testResultsDiv = document.getElementById('testResults');
        const testSummaryDiv = document.getElementById('testSummary');
        let testsPassed = 0;
        let testsFailed = 0;

        function logTest(name, passed, message = '') {
            const logEntry = document.createElement('div');
            logEntry.className = 'log ' + (passed ? 'pass' : 'fail');
            logEntry.textContent = `[${passed ? 'PASS' : 'FAIL'}] ${name}`;
            if (message) {
                logEntry.textContent += `: ${message}`;
            }
            testResultsDiv.appendChild(logEntry);
            if (passed) {
                testsPassed++;
            } else {
                testsFailed++;
            }
        }

        // Assertion helper
        function assert(condition, message) {
            if (!condition) {
                throw new Error(message || "Assertion failed");
            }
        }
        function assertEqual(actual, expected, message) {
            if (actual !== expected) {
                throw new Error(message || `Expected ${expected}, but got ${actual}`);
            }
        }
         function assertDeepEqual(actual, expected, message) {
            // Basic deep equal for simple objects/arrays used in game
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error(message || `Expected ${JSON.stringify(expected)}, but got ${JSON.stringify(actual)}`);
            }
        }


        function runTest(testFn) {
            try {
                testFn(); // This will call logTest internally for specific assertions
            } catch (e) {
                // Catch errors from assert helpers or other unexpected errors in test logic
                logTest(testFn.name, false, `ERROR: ${e.message}${e.stack ? `\n${e.stack}` : ''}`);
            }
        }

        function runAllTests() {
            testResultsDiv.innerHTML = ''; // Clear previous results
            testSummaryDiv.innerHTML = '';
            testsPassed = 0;
            testsFailed = 0;

            console.log("Starting all tests...");

            // Call all test functions defined in tests.js
            // These functions should use logTest to report their individual assertions.
            // Example: runTest(testExample);
            runTest(testCheckCollision);
            runTest(testPlayerInstantiation);
            runTest(testPlayerDamage);
            runTest(testPlayerInvulnerability);
            runTest(testCollectibleSpawningAndScoring); // More of an integration test
            runTest(testEnemyInstantiation);
            runTest(testEnemyDamage);
            runTest(testChasingFishAI);
            // Add more test calls here for other enemy AI, zone transitions etc.

            console.log("All tests finished.");
            updateTestSummary();
        }

        function updateTestSummary() {
            testSummaryDiv.innerHTML = `Total Tests: ${testsPassed + testsFailed} | Passed: <span class="summary-pass">${testsPassed}</span> | Failed: <span class="summary-fail">${testsFailed}</span>`;
        }

        // Optional: Auto-run tests on load for convenience during development
        // window.onload = runAllTests;
    </script>
</body>
</html>
